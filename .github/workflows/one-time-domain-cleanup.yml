name: One-time custom domain cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-domain-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy domain and brand in production HTML
        run: |
          find public -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' \) -print0 | xargs -0 sed -i 's#https://service-business-repository\.irishambience\.workers\.dev#https://servicepricingtools.com#g'
          find public -type f -name '*.html' -print0 | xargs -0 sed -i 's#Service Business <span>Calculators</span>#Service Pricing <span>Tools</span>#g'
          find public -type f -name '*.html' -print0 | xargs -0 sed -i 's#Service Business Calculators#Service Pricing Tools#g'
      - name: Commit cleanup if needed
        run: |
          if git diff --quiet; then
            echo 'No legacy references found.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          git commit -m 'Finish custom domain and brand cleanup'
          git push
