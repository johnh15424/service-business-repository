name: Submit changed pages to IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
  workflow_dispatch:

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare deployment
        run: |
          for i in {1..12}; do
            if curl -fsS "https://servicepricingtools.com/13f4dcb7d82e0d9d9815a192a3cbe0f1.txt" | grep -q "13f4dcb7d82e0d9d9815a192a3cbe0f1"; then
              exit 0
            fi
            sleep 15
          done
          echo "IndexNow key not live yet" >&2
          exit 1
      - name: Submit sitemap URLs to IndexNow
        run: |
          curl -fsS -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{
              "host": "servicepricingtools.com",
              "key": "13f4dcb7d82e0d9d9815a192a3cbe0f1",
              "keyLocation": "https://servicepricingtools.com/13f4dcb7d82e0d9d9815a192a3cbe0f1.txt",
              "urlList": [
                "https://servicepricingtools.com/",
                "https://servicepricingtools.com/dog-grooming-price-calculator/",
                "https://servicepricingtools.com/grooming-pricing-guide/",
                "https://servicepricingtools.com/dog-grooming-business-costs/",
                "https://servicepricingtools.com/mobile-dog-grooming-pricing/",
                "https://servicepricingtools.com/dog-grooming-profit-margin/",
                "https://servicepricingtools.com/how-to-price-dog-grooming-services/",
                "https://servicepricingtools.com/dog-grooming-price-list-guide/"
              ]
            }'
