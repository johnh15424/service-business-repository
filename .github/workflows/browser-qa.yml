name: Browser QA

# Real-browser regression for the conversion funnel on every PR: all 20 calculators at iPhone, Android,
# tablet and desktop sizes, plus the complete €4 quotation journey against the local preview with a fake
# PayPal. Nothing is deployed, no credential is used and no request reaches Google, PayPal or Payhip.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Calculator matrix and €4 quote journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local preview with mock checkout
        run: |
          QUOTE_DEV_CHECKOUT=mock node scripts/quote-dev-server.mjs > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8081/api/quotes/config >/dev/null && exit 0; sleep 1; done
          cat /tmp/preview.log; exit 1
      - name: Calculator matrix (20 calculators x 4 viewports)
        run: node tests/browser/audit.mjs --json /tmp/audit.json
      - name: €4 quotation journey (three calculator runtimes)
        run: node tests/browser/quote-flow.mjs http://127.0.0.1:8081 house_cleaning,gutter_cleaning,pressure_washing,lawn_care,dog_grooming,mobile_car_detailing

  branch-preview:
    name: Deployed branch preview (no production analytics, no payments)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Payhip products linked from the site (public pages, no orders; informational)
        continue-on-error: true
        run: node tests/browser/payhip-check.mjs
      - name: Wait for the Workers Builds preview of this commit
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          url="https://${alias}-service-business-repository.irishambience.workers.dev"
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          want=$(sha256sum public/assets/result-cta.js | cut -d' ' -f1)
          for i in $(seq 1 40); do
            got=$(curl -sS -f "$url/assets/result-cta.js?v=$i" 2>/dev/null | sha256sum | cut -d' ' -f1 || true)
            [ "$got" = "$want" ] && { echo "Preview $url serves this commit."; exit 0; }
            sleep 15
          done
          echo "::error::Preview $url did not serve this commit within 10 minutes"; exit 1
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit the deployed preview
        run: node tests/browser/audit.mjs "$PREVIEW_URL" --deployed --expect-tag no --expect-quote=hidden --json /tmp/preview-audit.json
